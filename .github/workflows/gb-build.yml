name: GB Fetch & Build
# 中国广电资费抓取（全国 + 31 省 + 深圳），产物提交到 gb/data
#
# 定时：主站（mobile-build.yml）每轮会派发一次；本站自带 2 小时 cron 兜底。
# 原因同电信：主站轮次被平台延迟漂移后会落在子站「还不够旧」的时刻被闸门跳过，
# 广电数据连续 3 小时不更新。独立 cron + 先看数据年龄，保节拍不空跑。
on:
  schedule:
    - cron: "10 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gb-build
  # 同电信：禁止取消正在跑的轮次，避免抓到一半被掐断
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 新鲜度闸门（数据未过期不重复抓取）
        id: gate
        run: |
          U=$(curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/gb/data/latest.json" 2>/dev/null \
              | python3 -c "import json,sys;print(json.load(sys.stdin).get('updated',''))" 2>/dev/null || true)
          AGE=99999
          if [ -n "$U" ]; then AGE=$(( $(date -u +%s) - $(date -u -d "$U" +%s) )) || AGE=99999; fi
          echo "线上广电数据距今 $((AGE/60)) 分钟"
          if [ "$AGE" -lt 5400 ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "数据仍新鲜（<90 分钟），本轮跳过"
          fi

      - name: 抓取广电资费（全国 + 31 省 + 深圳）
        if: steps.gate.outputs.skip != '1'
        run: |
          set -e
          set -o pipefail
          cd "$GITHUB_WORKSPACE/pipelines"
          python3 -u gb_pipeline.py --prev-dir ../gb/data --out-dir ../gb/data 2>&1 | tail -120
          python3 -c "import json;d=json.load(open('../gb/data/latest.json',encoding='utf-8'));print('[广电] updated =',d.get('updated'),'| 板块 =',len(d.get('sections',[])))"

      - name: 提交
        if: success() && steps.gate.outputs.skip != '1'
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          rm -rf /tmp/art && mkdir -p /tmp/art
          cp -a gb/data /tmp/art/data || { echo "::error::产物缺失"; exit 1; }
          git config user.name "tariff-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard FETCH_HEAD
            rm -rf gb/data
            cp -a /tmp/art/data gb/data || { echo "::error::data 复制失败"; exit 1; }
            git add -A gb/data
            BAD="$(git diff --cached --name-only | grep -vE '^gb/data/' || true)"
            if [ -n "$BAD" ]; then echo "::error::检测到非数据文件被暂存，已中止"; echo "$BAD"; exit 1; fi
            if git diff --cached --quiet; then echo "无变化"; exit 0; fi
            git commit -q -m "gb fetch $(date -u +%FT%TZ)"
            if git push origin main; then echo "已推送"; exit 0; fi
            echo "[warn] push 失败，重新对齐后重试 ($i/5)"
            sleep 8
          done
          echo "::error::连续 5 次 push 均失败"
          exit 1
