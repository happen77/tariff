name: Telecom Fetch & Build
# 中国电信资费抓取（全国 + 31 省），产物提交到 telecom/data
#
# 定时：主站（mobile-build.yml）每轮会派发一次；本站自带 2 小时 cron 兜底。
# 原因：GitHub schedule 对本仓库延迟 0~9 小时不定，主站轮次会漂到 06:32 / 08:37
# 这种非整点，主站 subsites 的「数据新鲜度」闸门于是整轮跳过本站，电信数据被拖到
# 3 小时以上（2026-11-25 08:46 → 11:47 即此）。独立 cron + 先看数据年龄，既保住
# 2 小时节拍，又不空跑。
on:
  schedule:
    - cron: "5 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telecom-build
  # 禁止 cancel-in-progress：新轮直接取消旧轮会掐断正在跑的抓取，产物丢失
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 新鲜度闸门（数据未过期不重复抓取）
        id: gate
        run: |
          U=$(curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/telecom/data/latest.json" 2>/dev/null \
              | python3 -c "import json,sys;print(json.load(sys.stdin).get('updated',''))" 2>/dev/null || true)
          AGE=99999
          if [ -n "$U" ]; then AGE=$(( $(date -u +%s) - $(date -u -d "$U" +%s) )) || AGE=99999; fi
          echo "线上电信数据距今 $((AGE/60)) 分钟"
          if [ "$AGE" -lt 5400 ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "数据仍新鲜（<90 分钟），本轮跳过"
          fi

      - run: pip install pycryptodome
        if: steps.gate.outputs.skip != '1'

      - name: 抓取电信资费（全国 + 31 省）
        if: steps.gate.outputs.skip != '1'
        run: |
          set -e
          set -o pipefail
          cd "$GITHUB_WORKSPACE/pipelines"
          # prev 与 out 同目录：管线在抓取前已把上一版全部读入内存
          python3 -u telecom_pipeline.py --prev-dir ../telecom/data --out-dir ../telecom/data 2>&1 | tail -120
          python3 -c "import json;d=json.load(open('../telecom/data/latest.json',encoding='utf-8'));print('[电信] updated =',d.get('updated'),'| 板块 =',len(d.get('sections',[])))"

      - name: 提交
        if: success() && steps.gate.outputs.skip != '1'
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          rm -rf /tmp/art && mkdir -p /tmp/art
          cp -a telecom/data /tmp/art/data || { echo "::error::产物缺失"; exit 1; }
          git config user.name "tariff-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard FETCH_HEAD
            rm -rf telecom/data
            cp -a /tmp/art/data telecom/data || { echo "::error::data 复制失败"; exit 1; }
            git add -A telecom/data
            BAD="$(git diff --cached --name-only | grep -vE '^telecom/data/' || true)"
            if [ -n "$BAD" ]; then echo "::error::检测到非数据文件被暂存，已中止"; echo "$BAD"; exit 1; fi
            if git diff --cached --quiet; then echo "无变化"; exit 0; fi
            git commit -q -m "telecom fetch $(date -u +%FT%TZ)"
            if git push origin main; then echo "已推送"; exit 0; fi
            echo "[warn] push 失败，重新对齐后重试 ($i/5)"
            sleep 8
          done
          echo "::error::连续 5 次 push 均失败"
          exit 1
